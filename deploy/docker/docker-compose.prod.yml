# Chạy toàn bộ hệ thống bằng image đã build:
#   cp deploy/docker/.env.example deploy/docker/.env   # rồi sửa mật khẩu
#   docker compose -f deploy/docker/docker-compose.prod.yml --env-file deploy/docker/.env up -d
# Build image từ source thay vì kéo từ GHCR: thêm --build
name: openspec

x-connection: &connection "Server=sqlserver;Database=OpenSpec;User Id=sa;Password=${MSSQL_SA_PASSWORD:?};TrustServerCertificate=True"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Đặt MSSQL_SA_PASSWORD trong .env}
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  migrator:
    image: ${REGISTRY:-ghcr.io/manhquangsst6}/openspec-migrator:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      target: migrator
    environment:
      ConnectionStrings__Default: *connection
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  api:
    image: ${REGISTRY:-ghcr.io/manhquangsst6}/openspec-api:${IMAGE_TAG:-latest}
    build:
      context: ../../backend
      target: api
    environment:
      ConnectionStrings__Default: *connection
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      # Image aspnet không có curl: gọi /health bằng bash /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5
    restart: unless-stopped

  web:
    image: ${REGISTRY:-ghcr.io/manhquangsst6}/openspec-web:${IMAGE_TAG:-latest}
    build:
      context: ../../frontend
    environment:
      API_URL: http://api:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqldata:
